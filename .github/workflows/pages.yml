# The landing page and the user guide (site/) on GitHub Pages. A pull request
# only builds; a push to main or a manual run publishes. Pages has to be
# switched to "GitHub Actions" once, in Settings → Pages.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/guide/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/guide/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push waits rather than cancelling a deployment already publishing.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The guide's "last updated" line reads each page's git history.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - run: npm ci
        working-directory: site

      - name: Build
        working-directory: site
        env:
          # /<repository> on github.io, empty once the repository has a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
