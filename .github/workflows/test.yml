name: Tests

# What this is for: "the same code works on SQLite, MySQL and Postgres" used to
# be an assertion. The fork's fixture could always be pointed at a MySQL or a
# Postgres, but nothing ever pointed it at one — no compose file, no job here —
# so every run took the SQLite branch and passed, and the eighteen
# dialect-specific branches in the store were never executed on two of the three
# vendors they exist for. The generated MySQL and Postgres DDL had never been
# executed at all.
#
# The containers are started by the tests themselves (internal/dbtest,
# testcontainers-go), so this job sets one environment variable and runs
# `go test`. There is nothing here to keep in step with a compose file.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go / ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # sqlite3 is what the desktop application runs on and needs no
        # container; the other two are the claim this matrix exists to check.
        db: [sqlite3, mysql, postgres]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # frontend/dist is what go:embed reads under the `frontend` tag. These jobs
      # do not build the page, so the directory only has to exist — a committed
      # .gitkeep holds it open, and this is here as the reminder of why.
      - name: Check the embed directory is there
        run: test -d frontend/dist

      - name: Vet
        run: go vet ./...

      # The whole suite on SQLite; on the other two, the packages that talk to a
      # database. The rest is the agent integration and the page's Go side,
      # which have no SQL of their own and would only pay the container's
      # startup twice over.
      - name: Test
        env:
          FOCALBOARD_STORE_TEST_DB_TYPE: ${{ matrix.db }}
        run: |
          if [ "${{ matrix.db }}" = "sqlite3" ]; then
            go test -count=1 ./...
          else
            go test -count=1 \
              ./server/services/store/... ./server/integrationtests/...
          fi

  # The page calls Go through bindings generated from App and committed
  # (frontend/bindings). bindings_test.go catches a method added or removed; this
  # regenerates them with the version of Wails go.mod names and fails on any
  # difference, which is what also catches a changed signature.
  bindings:
    name: bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install the Wails CLI go.mod names
        run: go install "github.com/wailsapp/wails/v3/cmd/wails3@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
      - name: Regenerate the bindings
        run: wails3 task common:generate:bindings
      - name: They are what was committed
        run: |
          git status --porcelain -- frontend/bindings
          test -z "$(git status --porcelain -- frontend/bindings)"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Nothing here runs cypress; its binary is a download per install.
      - run: npm ci
        working-directory: frontend
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: npm test
        working-directory: frontend
