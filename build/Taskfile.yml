version: '3'

# Tasks shared by every platform, shaped after the ones `wails3 init` writes.
# Where they differ from a stock project it is for one of two reasons: the
# frontend is `webapp/`, not `frontend/`, and a release build does not serve it
# through the Wails asset server but through the in-process board server
# behind proxy.go — so the build has to produce `webapp/pack`, where go:embed
# reads it.
#
# The bindings are generated as in the template, but committed and not
# regenerated by every build: building or testing the page then needs no Go.

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Universal/multi-arch builds invoke this concurrently from parallel deps;
    # two `go mod tidy` processes racing on go.mod can corrupt it (#4637).
    run: once
    cmds:
      - go mod tidy

  build:frontend:
    summary: Builds the XCIII webapp for go:embed
    # Every platform build depends on this; `run: once` keeps a universal
    # (multi-arch) build from running two npm builds over the same output.
    run: once
    sources:
      - webapp/src/**/*
      - webapp/bindings/**/*
      - webapp/static/**/*
      - webapp/index.html
      - webapp/package.json
      - webapp/package-lock.json
      - webapp/vite.config.ts
    generates:
      - webapp/pack/**/*
    preconditions:
      - sh: test -d webapp/node_modules
        msg: "webapp dependencies are missing. Run `npm ci` in webapp/ first."
    cmds:
      # The bundle is embedded from where Vite writes it, no staging copy, and
      # Vite empties webapp/pack itself before writing (emptyPack in
      # vite.config.ts) — around its .gitkeep, because `go mod tidy` runs as a
      # parallel dep of the same builds and resolves `//go:embed all:` under
      # every build tag, so the directory must hold an embeddable file at all
      # times or the build dies with "pattern all: ... no such file or
      # directory" whenever tidy wins the race.
      - cd webapp && npm run pack

  generate:bindings:
    summary: Regenerates webapp/bindings from the App service
    # After any change to a method of App. bindings_test.go notices a method
    # added or removed without this, and CI regenerates and compares, which
    # also catches a changed signature.
    #
    # Generated against the headless build with cgo off. App is the same
    # service in both builds and the output is identical, and this is the
    # combination that type-checks on any machine: the desktop one needs GTK's
    # headers on Linux.
    env:
      CGO_ENABLED: "0"
    cmds:
      - wails3 generate bindings -f "-tags server" -clean=true -ts -i -noevents -d webapp/bindings

  dev:frontend:
    summary: Runs the Vite dev server a development build takes the page from
    # Started by `wails3 dev` (build/config.yml), which picks the port and
    # hands the app the same address in FRONTEND_DEVSERVER_URL. On 127.0.0.1
    # rather than the template's "localhost", which Node binds to ::1 on
    # Windows; the app is pointed at the same address (devserver.go).
    dir: webapp
    cmds:
      - npm run dev -- --host 127.0.0.1 --port {{.VITE_PORT}} --strictPort

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` from an image; on macOS, `-iconcomposerinput appicon.icon -macassetdir darwin` also produces `Assets.car` from a `.icon` file (skipped on other platforms).
    run: once
    dir: build
    sources:
      - "appicon.png"
      - "appicon.icon"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico -iconcomposerinput appicon.icon -macassetdir darwin

  setup:docker:
    summary: Builds the image Linux (and macOS-from-elsewhere) cross-compilation needs (~800MB)
    desc: |
      The desktop build needs cgo on Linux and macOS — Wails itself does, GTK
      and Cocoa — and cgo does not cross-compile with the host toolchain, so
      this image (Zig + GTK/WebKit headers + the macOS SDK) is the way to
      produce a Linux binary from a Mac. Build it once, then
      `wails3 task linux:build` picks it up by itself. Windows needs none of
      it: that build is pure Go.
    cmds:
      - docker build -t wails-cross -f build/docker/Dockerfile.cross build/docker/
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    desc: |
      Builds a production server binary by default: -tags server,production,
      -trimpath and a stripped binary, mirroring the desktop `build` task.
      Server mode runs as a pure HTTP server without native GUI dependencies —
      the same app, reached with a browser instead of a webview.

      Usage: task build:server [DEV=true] [EXTRA_TAGS=tag1,tag2]
        DEV=true        development server (no strip, inlining kept)
        EXTRA_TAGS      additional comma-separated build tags
    deps:
      - task: go:mod:tidy
      - task: build:frontend
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}"
    vars:
      BUILD_FLAGS: '-tags server,{{.EXTRA_TAGS}}{{if ne .DEV "true"}},production -trimpath -ldflags="-w -s"{{else}}{{end}} -buildvcs=false'
    # CGO_ENABLED is left to Go: a server needs no Wails, so cgo matters here
    # only for which SQLite driver is linked — mattn where a C compiler is
    # found, modernc's pure Go where it is not (sqlstore/sqlite_pure.go). Both
    # work; forcing 1 only made a Windows host without MinGW fail to build.

  run:server:
    summary: Builds and runs a development server (DEV=true)
    deps:
      - task: build:server
        vars:
          DEV: "true"
    cmds:
      - '"./{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}"'

  build:docker:
    summary: Builds a Docker image of the headless server
    desc: |
      The template's server-mode image (build/docker/Dockerfile.server), with
      the page built first: webapp/pack is embedded, and the image has no node.
      Pure Go on distroless/static by default.

      Usage: task build:docker [TAG=xciii:latest] [CGO_ENABLED=1] [GO_IMAGE=...] [RUNTIME_IMAGE=...] [EDITION=lifetime]
      For mattn's SQLite instead of modernc's:
        task build:docker CGO_ENABLED=1 GO_IMAGE=golang:bookworm RUNTIME_IMAGE=gcr.io/distroless/base-debian12
    deps:
      - task: build:frontend
    cmds:
      - >-
        docker build
        --build-arg CGO_ENABLED={{.CGO_ENABLED | default "0"}}
        --build-arg GO_IMAGE={{.GO_IMAGE | default "golang:alpine"}}
        --build-arg RUNTIME_IMAGE={{.RUNTIME_IMAGE | default "gcr.io/distroless/static-debian12"}}
        --build-arg TAGS=server,production,frontend,json1,sqlite3{{.EDITION_TAG}}
        -t {{.TAG | default "xciii:latest"}}
        -f build/docker/Dockerfile.server .
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."

  run:docker:
    summary: Builds and runs the Docker image, its data in the xciii-data volume
    desc: |
      Usage: task run:docker [TAG=xciii:latest] [PORT=8080]
      The container listens on 8080; PORT is the host side. The database and
      the rest are the environment's (build/docker/Dockerfile.server) — run
      `docker run` yourself to pass XCIII_DB_TYPE and XCIII_DB_DSN.
    deps:
      - task: build:docker
    cmds:
      - docker run --rm -p {{.PORT | default "8080"}}:8080 -v xciii-data:/data {{.TAG | default "xciii:latest"}}
