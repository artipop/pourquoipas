version: '3'

# Tasks shared by every platform, the ones `wails3 init` writes. Where they
# differ from a stock project:
#
# - a release build does not serve the page through the Wails asset server
#   but through the in-process board server behind the front door, from the
#   frontend/dist go:embed compiles in (frontend_embed.go);
# - the bindings are generated from the headless build whatever the platform
#   (generate:bindings says why).
tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Universal/multi-arch builds invoke this concurrently from parallel deps;
    # two `go mod tidy` processes racing on go.mod can corrupt it (#4637).
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "Looks like npm isn't installed. Npm is part of the Node installer: https://nodejs.org/en/download/"
    cmds:
      # The template's `npm install`, not `npm ci`: over a tree CI already
      # installed it is a no-op, where `npm ci` would delete and fetch it all
      # again in every release job.
      - npm install

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the frontend project
    # Every platform build depends on this; `run: once` keeps a universal
    # (multi-arch) build from running two npm builds over the same output.
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
      - exclude: dist/**/*
      - exclude: coverage/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
    cmds:
      # Vite empties dist itself before writing (emptyDist in vite.config.ts) —
      # around its .gitkeep, because `go mod tidy` runs as a parallel dep of
      # the same builds and resolves `//go:embed all:` under every build tag,
      # so the directory must hold an embeddable file at all times or the
      # build dies with "pattern all: ... no such file or directory" whenever
      # tidy wins the race.
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} -q
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  generate:bindings:
    summary: Generates bindings for the frontend
    # Every build regenerates them when Go changed, as in the template. They
    # are committed all the same, so the page builds and tests without Go;
    # bindings_test.go and CI's regeneration catch a commit that forgot them.
    #
    # Generated against the headless build with cgo off rather than with the
    # build's own flags. App is the same service in both builds and the output
    # is identical, and this is the combination that type-checks on any
    # machine: the desktop one needs GTK's headers on Linux.
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    env:
      CGO_ENABLED: "0"
    cmds:
      - wails3 generate bindings -f "-tags server" -clean=true -ts -i -noevents

  dev:frontend:
    summary: Runs the frontend in development mode
    # Started by `wails3 dev` (build/config.yml), which picks the port and
    # hands the app the same address in FRONTEND_DEVSERVER_URL. On 127.0.0.1
    # rather than the template's "localhost", which Node binds to ::1 on
    # Windows; the app is pointed at the same address (devserver.go).
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      - npm run dev -- --host 127.0.0.1 --port {{.VITE_PORT}} --strictPort

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` from an image; on macOS, `-iconcomposerinput appicon.icon -macassetdir darwin` also produces `Assets.car` from a `.icon` file (skipped on other platforms).
    run: once
    dir: build
    sources:
      - "appicon.png"
      # The files inside: a directory alone is not looked into, so a new
      # picture in Assets/ left Assets.car as it was.
      - "appicon.icon/**/*"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico -iconcomposerinput appicon.icon -macassetdir darwin

  setup:docker:
    summary: Builds the image Linux (and macOS-from-elsewhere) cross-compilation needs (~800MB)
    desc: |
      The desktop build needs cgo on Linux and macOS — Wails itself does, GTK
      and Cocoa — and cgo does not cross-compile with the host toolchain, so
      this image (Zig + GTK/WebKit headers + the macOS SDK) is the way to
      produce a Linux binary from a Mac. Build it once, then
      `wails3 task linux:build` picks it up by itself. Windows needs none of
      it: that build is pure Go.
    cmds:
      - docker build -t wails-cross -f build/docker/Dockerfile.cross build/docker/
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    desc: |
      Builds a production server binary by default: -tags server,production,
      -trimpath and a stripped binary, mirroring the desktop `build` task.
      Server mode runs as a pure HTTP server without native GUI dependencies —
      the same app, reached with a browser instead of a webview.

      Usage: task build:server [DEV=true] [EXTRA_TAGS=tag1,tag2]
        DEV=true        development server (no strip, inlining kept)
        EXTRA_TAGS      additional comma-separated build tags
    deps:
      - task: go:mod:tidy
      - task: build:frontend
    cmds:
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}"
    vars:
      BUILD_FLAGS: '-tags server,{{.EXTRA_TAGS}}{{if ne .DEV "true"}},production -trimpath -ldflags="-w -s"{{else}}{{end}} -buildvcs=false'
    # CGO_ENABLED is left to Go: a server needs no Wails and its SQLite is pure
    # Go, so nothing here needs a C compiler; forcing 1 only made a Windows host
    # without MinGW fail to build.

  run:server:
    summary: Builds and runs a development server (DEV=true)
    deps:
      - task: build:server
        vars:
          DEV: "true"
    cmds:
      - '"./{{.BIN_DIR}}/{{.APP_NAME}}-server{{exeExt}}"'

  build:docker:
    summary: Builds a Docker image of the headless server
    desc: |
      The template's server-mode image (build/docker/Dockerfile.server), with
      the page built first: frontend/dist is embedded, and the image has no node.
      Pure Go on distroless/static by default.

      Usage: task build:docker [TAG=pourquoipas:latest] [GO_IMAGE=...] [RUNTIME_IMAGE=...] [EDITION=lifetime]
    deps:
      - task: build:frontend
    cmds:
      - >-
        docker build
        --build-arg GO_IMAGE={{.GO_IMAGE | default "golang:alpine"}}
        --build-arg RUNTIME_IMAGE={{.RUNTIME_IMAGE | default "gcr.io/distroless/static-debian12"}}
        --build-arg TAGS=server,production,frontend{{.EDITION_TAG}}
        -t {{.TAG | default "pourquoipas:latest"}}
        -f build/docker/Dockerfile.server .
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."

  run:docker:
    summary: Builds and runs the Docker image, its data in the pourquoipas-data volume
    desc: |
      Usage: task run:docker [TAG=pourquoipas:latest] [PORT=8080]
      The container listens on 8080; PORT is the host side. The database and
      the rest are the environment's (build/docker/Dockerfile.server) — run
      `docker run` yourself to pass PP_DB_TYPE and PP_DB_DSN.
    deps:
      - task: build:docker
    cmds:
      - docker run --rm -p {{.PORT | default "8080"}}:8080 -v pourquoipas-data:/data {{.TAG | default "pourquoipas:latest"}}
